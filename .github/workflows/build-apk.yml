name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: 11076708

      - name: Make gradlew executable
        working-directory: BS_v41/BarcodeScanner
        run: chmod +x gradlew

      - name: Build APK
        working-directory: BS_v41/BarcodeScanner
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          find BS_v41/BarcodeScanner/app/build/outputs/apk/debug/ -name "*.apk" \
            -exec cp {} output/DumpScan-v${{ github.run_number }}.apk \;
          ls -la output/

      - uses: actions/upload-artifact@v4
        with:
          name: DumpScan-APK-v${{ github.run_number }}
          path: output/DumpScan-v${{ github.run_number }}.apk
          retention-days: 90
